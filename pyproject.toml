[project]
name = "shiftwork"
version = "0.1.0"
description = "Shiftwork: persistent applied-AI-engineering learning environment (Nebius x NVIDIA hackathon build)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "httpx",
    "contree-client[httpx]==0.4.0",
]

[project.optional-dependencies]
test = [
    "pytest",
]
